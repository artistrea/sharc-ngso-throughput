# Exemplo completo de entrada para sharc/ngso_to_gso.py
# Execução: python sharc/ngso_to_gso.py -p scenarios/ngso2gso_docs/exemplo_completo.yaml
#
# Reproduz o cenário de scenarios/scenario_base.yaml (USASAT-NGSO-8, as quatro
# camadas orbitais das submissões 8A/8B/8C) já com gso_links preenchido,
# sem âncoras YAML e sem !!python/tuple, para ser lido por qualquer leitor YAML.
# Inclui quatro enlaces GSO em três localidades.

ngso2gso:
  version: 2
  scenario_name: cenario3_completo
  seed: 125
  delta_t_s: 1.0
  min_t_s: 0.0
  max_t_s: 1000000.0         # 10^6 passos; reduza para testes
  batch_size: 500
  ref_bandwidth_Hz: 1000000
  minimum_elevation: 35.0
  selection_strategy: RAND

  ngso_systems:
    # Cada item é um sistema NGSO (operador) com seu próprio Nco.
    # Todas as camadas de um sistema compartilham esse Nco.
    - label: USASAT-NGSO-8
      gso_protection_avoidance_angle: 2.0
      n_co_channel: 8
      # center_freq_GHz / bandwidth_MHz omitidos: assume sobreposição total
      # com a banda de cada enlace GSO (o simulador emite um aviso).
      tx_model:
        model: CONSTANT_PFD_AT_GND
        pfd_at_ref_bandwidth_dBW_m2: -115.0
      orbits:
        # USASAT-NGSO-8A. O phasing_deg não é fixo entre todos os planos na
        # submissão real; este valor é uma aproximação.
        - n_planes: 289
          sats_per_plane: 4
          inclination_deg: 51.9
          perigee_alt_km: 630.0
          apogee_alt_km: 630.0
          phasing_deg: 71.09
        # USASAT-NGSO-8A. ITU indica 33 graus de inclinação; FCC indica 30.
        - n_planes: 1
          sats_per_plane: 2
          inclination_deg: 30.0
          perigee_alt_km: 590.0
          apogee_alt_km: 590.0
          phasing_deg: 0.0           # irrelevante com um único plano
        # USASAT-NGSO-8B
        - n_planes: 1292
          sats_per_plane: 1
          inclination_deg: 42.0
          perigee_alt_km: 610.0
          apogee_alt_km: 610.0
          phasing_deg: 273.933
        # USASAT-NGSO-8C
        - n_planes: 782
          sats_per_plane: 1
          inclination_deg: 33.0
          perigee_alt_km: 590.0
          apogee_alt_km: 590.0
          phasing_deg: 16.615

  gso_links:
    # O par (label, earth_station.label) deve ser único.
    - label: Jupiter 97W GW
      orbital_slot_deg: -97.1
      center_freq_GHz: 20.075
      downlink_freq_MHz: [19700, 20200]
      bandwidth_MHz: 250.0
      eirp_dBW_per_carrier: 71.0
      peak_rx_antenna_gain: 62.0
      rx_antenna_size_m: 6.3
      g_over_t_dB_per_K: 38.0
      station_type: GW
      added_loss: 3.0
      earth_station:
        label: Miami
        lat_deg: 25.77
        lon_deg: -80.19

    - label: Jupiter 97W CT
      orbital_slot_deg: -97.1
      center_freq_GHz: 18.675
      downlink_freq_MHz: [18300, 20200]
      bandwidth_MHz: 500.0
      eirp_dBW_per_carrier: 71.0
      peak_rx_antenna_gain: 43.7
      rx_antenna_size_m: 0.9
      g_over_t_dB_per_K: 19.7
      station_type: CT
      added_loss: 3.0
      earth_station:
        label: Kansas
        lat_deg: 39.07
        lon_deg: -94.6

    - label: Galaxy 30 GW
      orbital_slot_deg: -125.0
      center_freq_GHz: 19.95
      downlink_freq_MHz: [17800, 20200]
      bandwidth_MHz: 140.0
      eirp_dBW_per_carrier: 64.0
      peak_rx_antenna_gain: 62.0
      rx_antenna_size_m: 9.4
      g_over_t_dB_per_K: 38.0
      station_type: GW
      added_loss: 3.0
      earth_station:
        label: Las Vegas
        lat_deg: 36.19
        lon_deg: -115.18

    - label: SES-17 CT
      orbital_slot_deg: -67.0
      center_freq_GHz: 18.0
      downlink_freq_MHz: [17800, 20200]
      bandwidth_MHz: 72.0
      eirp_dBW_per_carrier: 61.4
      peak_rx_antenna_gain: 42.7
      rx_antenna_size_m: 0.9
      g_over_t_dB_per_K: 18.7
      station_type: CT
      added_loss: 3.0
      earth_station:
        label: Miami
        lat_deg: 25.77
        lon_deg: -80.19
